<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>斷捨離助手</title>
<style>
:root{--g:#10b981;--r:#f43f5e;--y:#f59e0b;--t:#1e293b;--m:#64748b}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#f1f5f9;color:var(--t);display:flex;justify-content:center;min-height:100vh;-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:8px 12px;background:#fff;color:var(--t);box-shadow:0 1px 2px #0002}
button:disabled{opacity:.35}
#app{width:100%;max-width:440px;padding:12px;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px} .row2{display:flex;gap:6px}
#cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{white-space:nowrap;border-radius:99px;font-size:13px;padding:6px 12px}
.on{background:var(--t)!important;color:#fff!important}
.track{height:6px;background:#e2e8f0;border-radius:9px;overflow:hidden}
#bar{height:100%;width:0;background:var(--g);transition:width .3s}
#prog,.mute,small{font-size:12px;color:var(--m)}
#stack{position:relative;height:min(60vh,470px)}
.card{position:absolute;inset:0;background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 25px -8px #0003;touch-action:none;transition:transform .25s,opacity .25s}
.card.back{transform:scale(.95) translateY(14px);opacity:.9;pointer-events:none}
.card img{flex:1;min-height:0;width:100%;object-fit:cover;background:#e2e8f0;pointer-events:none}
.info{padding:12px 16px} .info p{font-size:13px;color:var(--m);margin-top:2px}
.stamp{position:absolute;top:20px;font-style:normal;font-weight:800;font-size:22px;padding:4px 14px;border:4px solid;border-radius:10px;background:#fffd;opacity:0;pointer-events:none}
.k{left:18px;color:var(--g);transform:rotate(-14deg)} .d{right:18px;color:var(--r);transform:rotate(14deg)}
.u{left:50%;top:auto;bottom:90px;color:var(--y);transform:translateX(-50%)}
.empty{position:absolute;inset:0;background:#fff;border:2px dashed #cbd5e1;border-radius:22px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px}
.acts{display:flex;gap:8px}
.acts button{flex:1;height:48px;font-weight:700;color:#fff}
.acts #undo{flex:none;width:52px;color:var(--m)}
#bk{background:var(--g)} #bu{background:var(--y);color:#1e293b} #bd{background:var(--r)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:#fff;border-radius:14px;padding:8px;font-size:11px;color:var(--m)} .stats b{display:block;font-size:20px;color:var(--t)}
#tabs{display:flex;gap:4px;background:#e2e8f0;padding:4px;border-radius:12px} #tabs button{flex:1;font-size:12px;box-shadow:none;background:none}
#list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border-radius:14px;padding:8px;display:flex;gap:10px;align-items:center}
.item img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#e2e8f0}
.item div{flex:1;min-width:0} .item b{display:block;font-size:14px} .item span button{font-size:11px;padding:4px 8px;margin-left:3px}
.send{background:var(--t);color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.send input{padding:10px;border-radius:10px;border:0} .send button{background:var(--g);color:#fff;font-weight:700}
dialog{border:0;border-radius:20px;padding:18px;width:min(92vw,380px);margin:auto}
dialog::backdrop{background:#0f172a80}
dialog form{display:flex;flex-direction:column;gap:10px}
dialog input,dialog textarea,dialog select{padding:10px;border:1px solid #cbd5e1;border-radius:10px;width:100%}
.pri{background:var(--g)!important;color:#fff!important;font-weight:700}
#pv{width:100%;max-height:160px;object-fit:cover;border-radius:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>🧹 斷捨離助手</h1>
  <div class="row2">
   <button onclick="sync(true)" title="重新整理">🔄</button>
   <button onclick="openAdd()">＋ 新增</button>
   <button onclick="view('sum')">📊 結果</button>
  </div>
 </header>

 <section id="swipe" style="display:flex;flex-direction:column;gap:10px">
  <div id="cats"></div>
  <div><div id="prog"></div><div class="track"><div id="bar"></div></div></div>
  <div id="stack"></div>
  <div class="acts">
   <button id="undo" onclick="undo()">↩</button>
   <button id="bk" onclick="btn('k')">💚 保留</button>
   <button id="bu" onclick="btn('u')">🤔 沒意見</button>
   <button id="bd" onclick="btn('d')">🗑 丟棄</button>
  </div>
  <small style="text-align:center">左滑＝保留、右滑＝丟棄、上滑＝沒意見</small>
 </section>

 <section id="sum" hidden style="display:flex;flex-direction:column;gap:10px">
  <button onclick="view('swipe')" style="align-self:flex-start">← 返回卡片</button>
  <div class="stats" id="stats"></div>
  <div id="tabs"></div>
  <div id="list"></div>
  <div class="send">
   <b>送出我的選擇</b>
   <input id="uname" placeholder="你的稱呼，例如：爸爸、小明">
   <button id="send" onclick="submit()">☁️ 送出到家長的試算表</button>
  </div>
 </section>
</div>

<dialog id="keepDlg">
 <form method="dialog" onsubmit="return false">
  <b>為什麼要留下它？</b>
  <small>想不出理由的話，就讓它走吧。</small>
  <textarea id="reason" rows="3" placeholder="例如：最近一週有用到、有紀念價值"></textarea>
  <div class="row2" style="flex-wrap:wrap">
   <button type="button" onclick="reason.value='近一週內有常用到'">常用到</button>
   <button type="button" onclick="reason.value='珍貴回憶紀念物品'">珍貴紀念</button>
   <button type="button" onclick="reason.value='市面上買不到的稀有品'">絕版稀有</button>
  </div>
  <button type="button" class="pri" onclick="keepOk()">確認保留</button>
  <button type="button" onclick="keepNo('d')" style="color:var(--r)">想不出理由，改為丟棄</button>
  <button type="button" onclick="keepNo('c')">取消</button>
 </form>
</dialog>

<dialog id="addDlg">
 <form onsubmit="addItem(event)">
  <b>新增物品（管理者）</b>
  <input type="file" id="file" accept="image/*">
  <img id="pv" hidden>
  <input id="iname" placeholder="物品名稱" required>
  <select id="icat"></select>
  <input id="inotes" placeholder="備註（選填）">
  <input id="ipw" type="password" placeholder="管理密碼" required>
  <button class="pri" id="addBtn">加入卡片盒</button>
  <button type="button" onclick="addDlg.close()">取消</button>
 </form>
</dialog>
<div id="toast"></div>

<script>
// ⚠️ 貼上你部署後的 Apps Script 網址
const API = "https://script.google.com/macros/s/AKfycbwqcznvSWMSlS_76qQSCJ3Xz4e6sOBqtEUwBZ9tC6xD_TbBzKunfmiDiH130lslRInp/exec";
const CATS = ['客廳','臥室','廚房','書房','陽台與雜物'];
const EMO = {客廳:'🛋️',臥室:'🛏️',廚房:'🍳',書房:'📚','陽台與雜物':'📦'};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch { toast('瀏覽器儲存空間不足') } };
function toast(m) { const t = $('toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(t._t); t._t = setTimeout(() => t.style.opacity = 0, 2200) }

let items = load('items', []);        // 雲端物品清單（只含圖片網址，體積很小）
let choices = load('choices', {});    // 我自己的選擇 { id: {status, reason} }
let cat = 'ALL', tab = 'discard', hist = [], pend = null, photo = null;
$('icat').innerHTML = CATS.map(c => `<option>${c}</option>`).join('');
$('uname').value = localStorage.getItem('uname') || '';
$('ipw').value = localStorage.getItem('pw') || '';

// ---------- 雲端 ----------
async function sync(manual) {
  try {
    const j = await (await fetch(API)).json();
    items = j.items; save('items', items);
    const ids = new Set(items.map(i => i.id));
    Object.keys(choices).forEach(k => ids.has(k) || delete choices[k]);
    save('choices', choices);
    if (manual) toast('已更新');
  } catch { toast('無法連線雲端，顯示上次的資料') }
  render();
}
async function post(body) {
  // text/plain 可避開 CORS 預檢，Apps Script 才讀得到
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '失敗');
  return j;
}

// ---------- 畫面 ----------
function view(v) { $('swipe').hidden = v !== 'swipe'; $('sum').hidden = v !== 'sum' }
function render() {
  $('cats').innerHTML = ['ALL', ...CATS].map(c => `<button class="chip${c === cat ? ' on' : ''}" data-c="${c}">${c === 'ALL' ? '全部' : EMO[c] + ' ' + c}</button>`).join('');
  const scope = items.filter(i => cat === 'ALL' || i.category === cat);
  const p = scope.filter(i => !choices[i.id]);
  const pct = scope.length ? Math.round((scope.length - p.length) / scope.length * 100) : 0;
  $('prog').textContent = `剩餘 ${p.length} 張・${pct}% 完成`;
  $('bar').style.width = pct + '%';
  const st = $('stack'); st.innerHTML = '';
  if (!p.length) st.innerHTML = `<div class="empty"><b>${scope.length ? '這個分類都決定完囉 🎉' : '還沒有物品'}</b><button onclick="view('sum')">查看結果並送出</button><button onclick="sync(true)">重新整理</button></div>`;
  else p.slice(0, 2).reverse().forEach((it, k, a) => st.appendChild(card(it, k === a.length - 1)));
  $('undo').disabled = !hist.length;
  renderSum();
}
function card(it, top) {
  const d = document.createElement('div');
  d.className = 'card' + (top ? '' : ' back'); d.dataset.id = it.id;
  d.innerHTML = `<i class="stamp k">保留</i><i class="stamp d">丟棄</i><i class="stamp u">考慮中</i>
   <img src="${esc(it.imageUrl)}" draggable="false" alt="">
   <div class="info"><b>${esc(it.name)}</b><p>${EMO[it.category] || '📦'} ${esc(it.category)}${it.notes ? '・' + esc(it.notes) : ''}</p></div>`;
  if (top) drag(d);
  return d;
}

// ---------- 滑動（pointer events：滑鼠與觸控共用，不會累積監聽器） ----------
function drag(el) {
  let x0, y0, dx = 0, dy = 0, on = false;
  const st = c => el.querySelector('.' + c).style;
  const reset = () => ['k', 'd', 'u'].forEach(c => st(c).opacity = 0);
  el.onpointerdown = e => { on = true; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; el.style.transition = 'none'; el.setPointerCapture(e.pointerId) };
  el.onpointermove = e => {
    if (!on) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    el.style.transform = `translate(${dx}px,${dy}px) rotate(${dx * .06}deg)`;
    const up = dy < -40 && -dy > Math.abs(dx);
    st('k').opacity = !up && dx < -40 ? 1 : 0;
    st('d').opacity = !up && dx > 40 ? 1 : 0;
    st('u').opacity = up ? 1 : 0;
  };
  el.onpointerup = el.onpointercancel = () => {
    if (!on) return; on = false; el.style.transition = '';
    const up = dy < -90 && -dy > Math.abs(dx);
    if (up) swipe(el, 'u'); else if (dx < -90) swipe(el, 'k'); else if (dx > 90) swipe(el, 'd');
    else { el.style.transform = ''; reset() }
  };
}
function btn(dir) { const t = $('stack').lastElementChild; if (t && t.dataset.id) swipe(t, dir) }
function swipe(el, dir) {
  const id = el.dataset.id; if (choices[id]) return;
  if (dir === 'k') return askKeep(
    r => { fly(el, 'k'); commit(id, 'keep', r) },
    () => { el.style.transform = ''; el.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0) },
    () => { fly(el, 'd'); commit(id, 'discard', '') });
  fly(el, dir); commit(id, dir === 'd' ? 'discard' : 'undecided', '');
}
function fly(el, d) { el.style.transform = { k: 'translate(-130vw,0) rotate(-25deg)', d: 'translate(130vw,0) rotate(25deg)', u: 'translate(0,-130vh)' }[d]; el.style.opacity = 0 }
function commit(id, status, reason) { choices[id] = { status, reason }; hist.push(id); save('choices', choices); setTimeout(render, 250) }
function undo() { const id = hist.pop(); if (id) { delete choices[id]; save('choices', choices); render(); toast('已復原') } }

// ---------- 保留理由 ----------
function askKeep(ok, cancel, toDiscard) { pend = { ok, cancel, toDiscard }; $('reason').value = ''; $('keepDlg').showModal() }
function keepOk() {
  const r = $('reason').value.trim(); if (!r) return toast('請填寫保留理由');
  $('keepDlg').close(); const p = pend; pend = null; p.ok(r);
}
function keepNo(kind) {
  $('keepDlg').close(); const p = pend; pend = null; if (!p) return;
  if (kind === 'd' && p.toDiscard) p.toDiscard(); else if (p.cancel) p.cancel();
}
$('keepDlg').addEventListener('cancel', e => { e.preventDefault(); keepNo('c') });

// ---------- 結果頁 ----------
const LBL = { keep: '保留', undecided: '考慮', discard: '丟棄' };
function renderSum() {
  const by = s => items.filter(i => choices[i.id]?.status === s);
  const n = { discard: by('discard').length, undecided: by('undecided').length, keep: by('keep').length };
  $('stats').innerHTML = `<div><b>${items.length}</b>總項目</div><div><b>${n.keep}</b>保留</div><div><b>${n.undecided}</b>沒意見</div><div><b>${n.discard}</b>丟棄</div>`;
  $('tabs').innerHTML = [['discard', '🗑 丟棄'], ['undecided', '🤔 考慮中'], ['keep', '💚 保留']].map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" data-t="${k}">${l} ${n[k]}</button>`).join('');
  $('list').innerHTML = by(tab).map(i => `<div class="item"><img src="${esc(i.imageUrl)}" alt=""><div><b>${esc(i.name)}</b><small>${esc(i.category)}${tab === 'keep' ? '・理由：' + esc(choices[i.id].reason) : ''}</small></div><span>${Object.keys(LBL).filter(s => s !== tab).map(s => `<button data-id="${esc(i.id)}" data-s="${s}">${LBL[s]}</button>`).join('')}</span></div>`).join('') || '<p class="mute">這個分類還沒有物品</p>';
}
$('cats').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { cat = b.dataset.c; render() } };
$('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; renderSum() } };
$('list').onclick = e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  const id = b.dataset.id, s = b.dataset.s;
  const set = (r) => { choices[id] = { status: s, reason: r }; save('choices', choices); render() };
  if (s === 'keep') askKeep(set, null, null); else set('');
};

// ---------- 送出結果 ----------
async function submit() {
  const name = $('uname').value.trim(); if (!name) return toast('請填寫你的稱呼');
  const list = items.filter(i => choices[i.id]).map(i => ({ id: i.id, title: i.name, category: i.category, status: choices[i.id].status, reason: choices[i.id].reason || '' }));
  if (!list.length) return toast('你還沒有做任何選擇');
  localStorage.setItem('uname', name);
  const b = $('send'); b.disabled = true; b.textContent = '送出中…';
  try { await post({ action: 'submit', userName: name, items: list }); toast('已送出成功 🎉') }
  catch (e) { toast('送出失敗：' + e.message) }
  b.disabled = false; b.textContent = '☁️ 送出到家長的試算表';
}

// ---------- 新增物品（照片先縮圖再上傳） ----------
function openAdd() { $('addDlg').showModal() }
function shrink(f) {
  return new Promise((ok, no) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', .7));
    };
    im.onerror = no; im.src = u;
  });
}
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { photo = await shrink(f); $('pv').src = photo; $('pv').hidden = false } catch { toast('無法讀取這張照片') }
};
async function addItem(e) {
  e.preventDefault();
  const b = $('addBtn'); b.disabled = true; b.textContent = '上傳中…';
  try {
    const pw = $('ipw').value;
    const j = await post({ action: 'addItem', password: pw, name: $('iname').value.trim(), category: $('icat').value, notes: $('inotes').value.trim(), image: photo });
    localStorage.setItem('pw', pw);
    items.unshift(j.item); save('items', items);
    $('addDlg').close(); e.target.reset(); $('pv').hidden = true; photo = null;
    render(); toast('已新增，所有家人重新整理後都會看到 📦');
  } catch (err) { toast('新增失敗：' + err.message) }
  b.disabled = false; b.textContent = '加入卡片盒';
}

render();
sync();
</script>
</body>
</html>
